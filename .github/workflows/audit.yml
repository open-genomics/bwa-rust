name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 1'
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  # rustsec/audit-check 有两条汇报通道，两条都需要写权限，缺任一条都会以
  # "Resource not accessible by integration" 失败：
  #   checks: write  写 check run —— 主通道，无论有无漏洞都会走
  #   issues: write  发现漏洞时开 issue 跟踪
  # 之前只有 contents: read，于是漏洞结果被权限错误掩盖（实测：修完依赖后
  # 漏洞已归零，但 job 仍因 check run 写不进去而失败）。
  checks: write
  issues: write

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
