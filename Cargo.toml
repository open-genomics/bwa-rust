[package]
name = "bwa-rust"
version = "0.2.0"
edition = "2021"
authors = ["LessUp"]
description = "A BWA-inspired sequence aligner implemented in Rust, featuring FM-index, SMEM seeding, and banded Smith-Waterman alignment"
license = "MIT"
repository = "https://github.com/open-genomics/bwa-rust"
readme = "README.md"
rust-version = "1.85"

# ── 依赖 ──────────────────────────────────────────────

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.217", features = ["derive"] }
bincode = "1.3.3"
rayon = "1.12.0"

# jemalloc：替换默认 allocator，补回 musl malloc 性能差距，多线程场景显著提升
# 仅在非 Windows 平台启用（Linux glibc/musl + macOS）
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

# ── Lint 配置 ─────────────────────────────────────────

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
needless_collect = "warn"
manual_memcpy = "warn"
large_enum_variant = "warn"
clone_on_ref_ptr = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
too_many_arguments = "allow"

# ── Profile 优化 ──────────────────────────────────────

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

[profile.test]
opt-level = 1
debug = true
